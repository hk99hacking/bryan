[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/create-pix"
  to = "/.netlify/functions/create-pix"
  status = 200
  force = true

[[redirects]]
  from = "/api/create-pix/"
  to = "/.netlify/functions/create-pix"
  status = 200
  force = true

[[redirects]]
  from = "/api/create-pix.php"
  to = "/.netlify/functions/create-pix"
  status = 200
  force = true

[[redirects]]
  from = "/api/check-pix"
  to = "/.netlify/functions/check-pix"
  status = 200
  force = true

[[redirects]]
  from = "/api/check-pix/"
  to = "/.netlify/functions/check-pix"
  status = 200
  force = true

[[redirects]]
  from = "/api/check-pix.php"
  to = "/.netlify/functions/check-pix"
  status = 200
  force = true

[[redirects]]
  from = "/api/meta-event"
  to = "/.netlify/functions/meta-event"
  status = 200
  force = true

[[redirects]]
  from = "/api/meta-event/"
  to = "/.netlify/functions/meta-event"
  status = 200
  force = true

[[redirects]]
  from = "/api/meta-event.php"
  to = "/.netlify/functions/meta-event"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/duttyfy"
  to = "/.netlify/functions/webhook-duttyfy"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/duttyfy/"
  to = "/.netlify/functions/webhook-duttyfy"
  status = 200
  force = true

[[redirects]]
  from = "/api/webhooks/duttyfy.php"
  to = "/.netlify/functions/webhook-duttyfy"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/storage/*"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.env"
  to = "/404"
  status = 404
  force = true

[[redirects]]
  from = "/.htaccess"
  to = "/404"
  status = 404
  force = true
